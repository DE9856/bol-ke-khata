name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: docker compose starts the app with no key
        run: |
          docker compose up --build -d
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/status && break; sleep 2; done
          curl -sf http://localhost:3000/ | grep -q "Bol ke Khata"
          docker compose down
